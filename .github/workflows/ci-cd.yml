name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Week2/cicd-project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cicd-project:1.0 Week2/cicd-project

  deploy:
    name: Deploy to AWS EC2
    needs: build
    runs-on: ubuntu-latest

    # Deploy only after code is pushed to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Connected to EC2 successfully!"

            cd ~/REPO-DD8280B8

            echo "Pulling latest code..."
            git pull origin main

            cd Week2/cicd-project

            echo "Building the latest Docker image..."
            docker build -t cicd-project:1.0 .

            echo "Stopping the previous container..."
            docker rm -f cicd-app || true

            echo "Starting the updated container..."
            docker run -d \
              --name cicd-app \
              --restart unless-stopped \
              -p 5000:5000 \
              cicd-project:1.0

            echo "Checking running containers..."
            docker ps

            echo "Deployment completed successfully!"
